<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Portfolio - Jeremy LeBlanc</title>

    <meta
        name="description"
        content="Technical art, VFX, Unity tools, shaders and real-time development work by Jeremy LeBlanc."
    >


    <!-- ===================================================
         FONT
         =================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ===================================================
         STYLES
         =================================================== -->

    <link
        rel="stylesheet"
        href="assets/css/site.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/components.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/pages.css"
    >

    <!-- SITE META START -->

    <link
        rel="icon"
        href="assets/images/ui/favicon.svg"
        type="image/svg+xml"
    >

    <link
        rel="canonical"
        href="https://leblancjs88.github.io/portfolio.html"
    >

    <meta
        name="theme-color"
        content="#071018"
    >


    <!-- Open Graph -->

    <meta
        property="og:site_name"
        content="Jeremy LeBlanc"
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:locale"
        content="en_US"
    >

    <meta
        property="og:title"
        content="Portfolio - Jeremy LeBlanc"
    >

    <meta
        property="og:description"
        content="Selected technical art, real-time VFX, Unity tooling, shader and performance work by Jeremy LeBlanc."
    >

    <meta
        property="og:url"
        content="https://leblancjs88.github.io/portfolio.html"
    >

    <meta
        property="og:image"
        content="https://leblancjs88.github.io/assets/images/ui/home-hero.jpg"
    >

    <meta
        property="og:image:alt"
        content="Selected work from Jeremy LeBlanc&#39;s Unity technical art and VFX portfolio."
    >


    <!-- Twitter / X -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Portfolio - Jeremy LeBlanc"
    >

    <meta
        name="twitter:description"
        content="Selected technical art, real-time VFX, Unity tooling, shader and performance work by Jeremy LeBlanc."
    >

    <meta
        name="twitter:image"
        content="https://leblancjs88.github.io/assets/images/ui/home-hero.jpg"
    >

    <!-- SITE META END -->

</head>


<body>

<div class="site">


    <!-- ===================================================
         HEADER
         =================================================== -->

    <header class="site-header">

        <div class="container site-header__inner">

            <a
                class="site-brand"
                href="index.html"
                aria-label="Jeremy LeBlanc home"
            >
                Jeremy
                <span class="site-brand__accent">
                    LeBlanc
                </span>
            </a>


            <nav
                class="site-nav"
                aria-label="Primary navigation"
            >

                <a
                    class="site-nav__link"
                    href="index.html"
                >
                    Home
                </a>

                <a
                    class="site-nav__link"
                    href="portfolio.html"
                >
                    Portfolio
                </a>

                <a
                    class="site-nav__link"
                    href="resume.html"
                >
                    Resume
                </a>

                <a
                    class="site-nav__link"
                    href="contact.html"
                >
                    Contact
                </a>

            </nav>


            <button
                class="mobile-nav-toggle"
                type="button"
                aria-label="Open navigation"
                aria-expanded="false"
            >

                <span class="mobile-nav-toggle__icon">
                    <span></span>
                </span>

            </button>

        </div>

    </header>



    <!-- ===================================================
         MAIN
         =================================================== -->

    <main>


        <!-- ===============================================
             PORTFOLIO HERO
             =============================================== -->

        <section class="portfolio-hero">


            <div class="portfolio-hero__background">

                <img
                    src="assets/images/ui/home-hero.jpg"
                    alt=""
                    aria-hidden="true"
                >

            </div>


            <div class="container portfolio-hero__content">


                <div class="eyebrow">
                    Selected Work
                </div>


                <h1 class="heading-page portfolio-hero__title">
                    Portfolio
                </h1>


                <p class="body-large portfolio-hero__description">

                    A selection of my work across technical art,
                    real-time VFX, Unity tooling, shaders and
                    performance-focused development.

                </p>


            </div>

        </section>



        <!-- ===============================================
             PROJECT LISTING
             =============================================== -->

        <section class="section portfolio-work">

            <div class="container">


                <!-- Header -->

                <div class="section-header">

                    <div>

                        <div class="eyebrow">
                            Projects
                        </div>

                    </div>


                    <div
                        class="text-muted"
                        data-project-count
                    >
                        Projects
                    </div>

                </div>



                <!-- =======================================
                     FILTERS
                     ======================================= -->

                <div class="portfolio-work__filters">

                    <div
                        class="filter-bar"
                        aria-label="Filter portfolio projects"
                    >

                        <button
                            class="filter-button is-active"
                            type="button"
                            data-project-filter="all"
                        >
                            All
                        </button>


                        <button
                            class="filter-button"
                            type="button"
                            data-project-filter="technical art"
                        >
                            Technical Art
                        </button>


                        <button
                            class="filter-button"
                            type="button"
                            data-project-filter="vfx"
                        >
                            VFX
                        </button>


                        <button
                            class="filter-button"
                            type="button"
                            data-project-filter="tools"
                        >
                            Tools
                        </button>


                        <button
                            class="filter-button"
                            type="button"
                            data-project-filter="optimization"
                        >
                            Optimization
                        </button>


                    </div>

                </div>



                <!-- =======================================
                     GENERATED PROJECT GRID
                     ======================================= -->

                <div
                    class="project-grid"
                    data-project-grid
                >

                    <!--
                        Cards are generated automatically
                        from data/projects.js.
                    -->

                </div>


            </div>

        </section>


    </main>



    <!-- ===================================================
         FOOTER
         =================================================== -->

    <footer class="site-footer">

        <div class="container site-footer__inner">

            <div class="site-footer__copyright">
                © Jeremy LeBlanc
            </div>


            <div class="site-footer__links">

                <a
                    class="site-footer__link"
                    href="portfolio.html"
                >
                    Portfolio
                </a>

                <a
                    class="site-footer__link"
                    href="resume.html"
                >
                    Resume
                </a>

                <a
                    class="site-footer__link"
                    href="contact.html"
                >
                    Contact
                </a>

            </div>

        </div>

    </footer>


</div>



<!-- =======================================================
     JAVASCRIPT

     Project data MUST load before project rendering.
     ======================================================= -->

<script src="data/projects.js"></script>

<script src="assets/js/projects.js"></script>

<script src="assets/js/site.js"></script>


</body>

</html>
